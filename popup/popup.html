<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AddFree</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="header-left">
      <img src="../icons/icon48.png" alt="" width="22" height="22">
      <h1>AddFree</h1>
    </div>
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabShield">Shield</button>
      <button type="button" class="tab-btn" id="tabRules">Manager</button>
    </div>
    <label class="switch" title="Toggle blocking globally on all websites">
      <input type="checkbox" id="global">
      <span></span>
    </label>
  </header>

  <!-- View 1: Shield / Controls -->
  <main id="viewShield">
    <div class="host-row">
      <p class="host" id="host">—</p>
      <span class="status-badge" id="statusBadge">Protected</span>
    </div>

    <div class="stats">
      <div><strong id="count">0</strong><span>Blocked on page</span></div>
      <div><strong id="total">0</strong><span>Total blocked</span></div>
    </div>

    <label class="row" id="siteRow">
      <span>Active on this site</span>
      <span class="switch">
        <input type="checkbox" id="site">
        <span></span>
      </span>
    </label>

    <div class="divider"></div>

    <!-- Quick Tools -->
    <div class="tools">
      <button type="button" class="tool-btn" id="pickerBtn" title="Pick and remove any element or advertisement on this page">
        <span class="icon">🎯</span>
        <span>Block Element</span>
      </button>

      <button type="button" class="tool-btn" id="updateBtn" title="Check and sync latest ad filters from GitHub">
        <span class="icon">🔄</span>
        <span id="updateTxt">Update Filters</span>
      </button>
    </div>

    <!-- Advanced Feature Toggles -->
    <div class="advanced-section">
      <label class="row sub-row" title="Fast-forwards and auto-skips YouTube and streaming video ads">
        <span>⚡ Video Ad Auto-Skip (16x)</span>
        <span class="switch small">
          <input type="checkbox" id="videoSkip">
          <span></span>
        </span>
      </label>

      <label class="row sub-row" title="Dismisses annoying cookie consent banners and CMP overlays">
        <span>🍪 Hide Cookie & CMP Banners</span>
        <span class="switch small">
          <input type="checkbox" id="blockCookies">
          <span></span>
        </span>
      </label>

      <label class="row sub-row" title="Removes fbclid, gclid, and utm tracking parameters from URLs">
        <span>🔗 Clean URLs (Strip Trackers)</span>
        <span class="switch small">
          <input type="checkbox" id="cleanUrls">
          <span></span>
        </span>
      </label>

      <label class="row sub-row" title="Hides floating Telegram channels and social badges">
        <span>💬 Hide Floating Social Badges</span>
        <span class="switch small">
          <input type="checkbox" id="social">
          <span></span>
        </span>
      </label>
    </div>

    <div class="footer-meta">
      <span id="rulesCount">Loading filters...</span>
      <span id="lastUpdated"></span>
    </div>

    <p class="note" id="note" hidden></p>
  </main>

  <!-- View 2: Dashboard & Custom Rules Manager -->
  <div id="viewRules" class="rules-view" hidden>
    <div class="manager-section">
      <div class="sec-title">
        <span>Whitelisted Websites</span>
        <span class="badge" id="wlCount">0</span>
      </div>
      <div class="item-list" id="wlList">
        <p class="empty-hint">No sites whitelisted yet.</p>
      </div>
    </div>

    <div class="manager-section">
      <div class="sec-title">
        <span>Custom Blocked Elements</span>
        <span class="badge" id="cfCount">0</span>
      </div>
      <div class="item-list" id="cfList">
        <p class="empty-hint">No elements blocked yet.</p>
      </div>
    </div>

    <div class="manager-actions">
      <button type="button" class="tool-btn" id="exportBtn">📥 Export Backup</button>
      <button type="button" class="tool-btn" id="importBtn">📤 Restore</button>
    </div>
    <p class="note" id="managerNote" hidden></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
